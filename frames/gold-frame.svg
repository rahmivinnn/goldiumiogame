<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="420" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="280" height="400" rx="15" ry="15" 
        fill="none" stroke="url(#goldBorder)" stroke-width="4"/>

  <!-- Corner Ornaments -->
  <path d="M10,10 Q40,10 40,40" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <path d="M290,10 Q260,10 260,40" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <path d="M10,410 Q40,410 40,380" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <path d="M290,410 Q260,410 260,380" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>

  <!-- Decorative Elements -->
  <circle cx="150" cy="30" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="150" cy="390" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="30" cy="210" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="270" cy="210" r="8" fill="#FFD700" opacity="0.8"/>

  <!-- Border Patterns -->
  <path d="M50,10 L250,10" stroke="#FFD700" stroke-width="1" stroke-dasharray="10,5" opacity="0.5"/>
  <path d="M50,410 L250,410" stroke="#FFD700" stroke-width="1" stroke-dasharray="10,5" opacity="0.5"/>
  <path d="M10,50 L10,370" stroke="#FFD700" stroke-width="1" stroke-dasharray="10,5" opacity="0.5"/>
  <path d="M290,50 L290,370" stroke="#FFD700" stroke-width="1" stroke-dasharray="10,5" opacity="0.5"/>
</svg> 