<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="royalPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="80" height="80" fill="#9370DB" opacity="0.1"/>
      
      <!-- Royal Crown Pattern -->
      <path d="M40,20 L60,30 L40,40 L20,30 Z" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.3"/>
      <circle cx="40" cy="30" r="2" fill="#FFD700" opacity="0.4"/>
      
      <!-- Fleur-de-lis Pattern -->
      <path d="M40,50 Q45,40 50,50 Q40,60 40,50 Q35,40 30,50 Q40,60 40,50" 
            fill="none" stroke="#8A2BE2" stroke-width="1" opacity="0.2"/>
      
      <!-- Decorative Swirls -->
      <path d="M10,40 Q20,30 30,40 Q40,50 50,40 Q60,30 70,40" 
            fill="none" stroke="#8A2BE2" stroke-width="1" opacity="0.2"/>
      <path d="M40,10 Q30,20 40,30 Q50,40 40,50 Q30,60 40,70" 
            fill="none" stroke="#8A2BE2" stroke-width="1" opacity="0.2"/>
      
      <!-- Corner Decorations -->
      <circle cx="10" cy="10" r="3" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.3"/>
      <circle cx="70" cy="10" r="3" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.3"/>
      <circle cx="10" cy="70" r="3" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.3"/>
      <circle cx="70" cy="70" r="3" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Apply Pattern -->
  <rect width="200" height="200" fill="url(#royalPattern)"/>
</svg> 