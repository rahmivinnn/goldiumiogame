<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="goldPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="40" height="40" fill="#FFD700" opacity="0.1"/>
      
      <!-- Decorative Elements -->
      <circle cx="20" cy="20" r="16" fill="none" stroke="#FFA500" stroke-width="1" opacity="0.3"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#FFA500" stroke-width="1" opacity="0.3"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#FFA500" stroke-width="1" opacity="0.3"/>
      
      <!-- Corner Decorations -->
      <path d="M5,5 L10,5 L5,10 Z" fill="#FFD700" opacity="0.4"/>
      <path d="M35,5 L30,5 L35,10 Z" fill="#FFD700" opacity="0.4"/>
      <path d="M5,35 L10,35 L5,30 Z" fill="#FFD700" opacity="0.4"/>
      <path d="M35,35 L30,35 L35,30 Z" fill="#FFD700" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Apply Pattern -->
  <rect width="200" height="200" fill="url(#goldPattern)"/>
</svg> 