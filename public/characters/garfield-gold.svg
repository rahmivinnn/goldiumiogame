<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradients -->
  <defs>
    <linearGradient id="goldFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Body -->
  <path d="M200,50 C300,50 350,150 350,250 C350,350 300,380 200,380 C100,380 50,350 50,250 C50,150 100,50 200,50" 
        fill="url(#goldFur)" stroke="#B8860B" stroke-width="8"/>
  
  <!-- Face -->
  <circle cx="160" cy="180" r="20" fill="#000000"/> <!-- Left eye -->
  <circle cx="240" cy="180" r="20" fill="#000000"/>  <!-- Right eye -->
  <circle cx="165" cy="175" r="5" fill="#FFFFFF"/> <!-- Eye shine -->
  <circle cx="245" cy="175" r="5" fill="#FFFFFF"/>
  
  <!-- Nose -->
  <path d="M190,220 Q200,230 210,220" stroke="#000000" stroke-width="4" fill="none"/>
  
  <!-- Smile -->
  <path d="M160,240 Q200,280 240,240" stroke="#000000" stroke-width="4" fill="none"/>
  
  <!-- Whiskers -->
  <path d="M140,230 L80,220 M140,240 L85,240 M140,250 L90,260" stroke="#B8860B" stroke-width="3"/>
  <path d="M260,230 L320,220 M260,240 L315,240 M260,250 L310,260" stroke="#B8860B" stroke-width="3"/>
  
  <!-- Ears -->
  <path d="M140,100 Q160,80 180,100" fill="url(#goldFur)" stroke="#B8860B" stroke-width="4"/>
  <path d="M220,100 Q240,80 260,100" fill="url(#goldFur)" stroke="#B8860B" stroke-width="4"/>
  
  <!-- Shine Effects -->
  <path d="M100,150 Q150,100 200,150" stroke="url(#goldShine)" stroke-width="8" fill="none" opacity="0.6"/>
  <circle cx="280" cy="120" r="15" fill="url(#goldShine)" opacity="0.8"/>
  <circle cx="120" cy="280" r="10" fill="url(#goldShine)" opacity="0.6"/>
</svg> 