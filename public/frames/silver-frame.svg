<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="420" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8"/>
      <stop offset="50%" style="stop-color:#C0C0C0"/>
      <stop offset="100%" style="stop-color:#A0A0A0"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="280" height="400" rx="15" ry="15" 
        fill="none" stroke="url(#silverBorder)" stroke-width="4"/>

  <!-- Corner Ornaments -->
  <path d="M10,10 L40,10 L40,40" fill="none" stroke="url(#silverBorder)" stroke-width="4"/>
  <path d="M290,10 L260,10 L260,40" fill="none" stroke="url(#silverBorder)" stroke-width="4"/>
  <path d="M10,410 L40,410 L40,380" fill="none" stroke="url(#silverBorder)" stroke-width="4"/>
  <path d="M290,410 L260,410 L260,380" fill="none" stroke="url(#silverBorder)" stroke-width="4"/>

  <!-- Decorative Elements -->
  <rect x="145" y="25" width="10" height="10" transform="rotate(45 150 30)" fill="#C0C0C0" opacity="0.8"/>
  <rect x="145" y="385" width="10" height="10" transform="rotate(45 150 390)" fill="#C0C0C0" opacity="0.8"/>
  <rect x="25" y="205" width="10" height="10" transform="rotate(45 30 210)" fill="#C0C0C0" opacity="0.8"/>
  <rect x="265" y="205" width="10" height="10" transform="rotate(45 270 210)" fill="#C0C0C0" opacity="0.8"/>

  <!-- Border Patterns -->
  <line x1="50" y1="10" x2="250" y2="10" stroke="#C0C0C0" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
  <line x1="50" y1="410" x2="250" y2="410" stroke="#C0C0C0" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
  <line x1="10" y1="50" x2="10" y2="370" stroke="#C0C0C0" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
  <line x1="290" y1="50" x2="290" y2="370" stroke="#C0C0C0" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
</svg> 