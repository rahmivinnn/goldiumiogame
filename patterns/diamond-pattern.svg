<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="diamondPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="50" height="50" fill="#B9F2FF" opacity="0.1"/>
      
      <!-- Diamond Shapes -->
      <path d="M25,5 L45,25 L25,45 L5,25 Z" fill="none" stroke="#87CEEB" stroke-width="1" opacity="0.3"/>
      <path d="M25,10 L40,25 L25,40 L10,25 Z" fill="none" stroke="#87CEEB" stroke-width="1" opacity="0.3"/>
      
      <!-- Sparkles -->
      <circle cx="25" cy="25" r="2" fill="#FFFFFF" opacity="0.4"/>
      <circle cx="5" cy="5" r="1" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="45" cy="5" r="1" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="5" cy="45" r="1" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="45" cy="45" r="1" fill="#FFFFFF" opacity="0.3"/>
      
      <!-- Light Beams -->
      <line x1="25" y1="0" x2="25" y2="50" stroke="#B9F2FF" stroke-width="2" opacity="0.2"/>
      <line x1="0" y1="25" x2="50" y2="25" stroke="#B9F2FF" stroke-width="2" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Apply Pattern -->
  <rect width="200" height="200" fill="url(#diamondPattern)"/>
</svg> 