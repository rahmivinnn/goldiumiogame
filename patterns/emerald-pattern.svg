<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="emeraldPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="60" height="60" fill="#50C878" opacity="0.1"/>
      
      <!-- Emerald Shapes -->
      <path d="M30,10 L50,30 L30,50 L10,30 Z" fill="none" stroke="#228B22" stroke-width="1" opacity="0.3"/>
      <path d="M30,15 L45,30 L30,45 L15,30 Z" fill="none" stroke="#228B22" stroke-width="1" opacity="0.3"/>
      
      <!-- Leaf Patterns -->
      <path d="M5,30 Q15,20 30,30 Q45,40 55,30" fill="none" stroke="#3CB371" stroke-width="1" opacity="0.2"/>
      <path d="M30,5 Q20,15 30,30 Q40,45 30,55" fill="none" stroke="#3CB371" stroke-width="1" opacity="0.2"/>
      
      <!-- Sparkles -->
      <circle cx="30" cy="30" r="2" fill="#90EE90" opacity="0.4"/>
      <circle cx="10" cy="10" r="1" fill="#90EE90" opacity="0.3"/>
      <circle cx="50" cy="10" r="1" fill="#90EE90" opacity="0.3"/>
      <circle cx="10" cy="50" r="1" fill="#90EE90" opacity="0.3"/>
      <circle cx="50" cy="50" r="1" fill="#90EE90" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Apply Pattern -->
  <rect width="200" height="200" fill="url(#emeraldPattern)"/>
</svg> 